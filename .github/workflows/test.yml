# GitHub Actions CI/CD Pipeline for Rnix
# Generated by BMad TEA Agent - Test Architect Module
# Stack: backend (Go 1.26) | Framework: go test
#
# Stages: lint → vet → test (with coverage + quality gates) → report
# Burn-in: scheduled only (weekly) — backend tests are deterministic

name: Test Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly burn-in on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      burn-in:
        description: "Run burn-in flaky detection (5 iterations)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.1"
  COVERAGE_THRESHOLD: "30"
  # Use Node.js 24 for actions (Node 20 deprecated on GitHub-hosted runners)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Stage 1: Lint - Static analysis with golangci-lint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          args: --allow-parallel-runners ./...

  # Stage 2: Vet & Modernize - Go vet and go fix checks
  vet:
    name: Vet & Modernize
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Go version and modules
        run: |
          go version
          go mod download
          go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Check go fix (modernize)
        run: |
          diff=$(go fix -diff ./... 2>&1)
          if [ -n "$diff" ]; then
            echo "$diff"
            echo "::error::Code needs modernization. Run 'go fix ./...' locally."
            exit 1
          fi

  # Stage 3: Test - Parallel execution with sharding and coverage
  test:
    name: Test (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, vet]

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Determine packages for shard
        id: packages
        run: |
          # List all packages with tests, split into shards
          all_pkgs=$(go list ./... | grep -v '^github.com/rnixai/rnix$')
          total=$(echo "$all_pkgs" | wc -l)
          shard=${{ matrix.shard }}
          total_shards=3

          # Calculate shard boundaries
          per_shard=$(( (total + total_shards - 1) / total_shards ))
          start=$(( (shard - 1) * per_shard + 1 ))
          end=$(( shard * per_shard ))

          shard_pkgs=$(echo "$all_pkgs" | sed -n "${start},${end}p" | tr '\n' ' ')
          echo "packages=$shard_pkgs" >> "$GITHUB_OUTPUT"
          echo "Shard $shard/$total_shards: $(echo "$shard_pkgs" | wc -w) packages"

      - name: Run tests with coverage
        run: |
          go test -race -coverprofile=coverage-${{ matrix.shard }}.out \
            -covermode=atomic -v \
            ${{ steps.packages.outputs.packages }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.out
          retention-days: 7

  # Stage 4: Burn-in - Flaky test detection (scheduled + manual only)
  burn-in:
    name: Burn-In (Flaky Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    # Backend: skip burn-in by default. Run only on schedule or explicit dispatch.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.burn-in == true)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Run burn-in loop (5 iterations)
        run: |
          echo "Starting burn-in loop - detecting flaky tests"
          for i in $(seq 1 5); do
            echo "========================================"
            echo "Burn-in iteration $i/5"
            echo "========================================"
            go test -race -count=1 ./... || exit 1
          done
          echo "Burn-in complete - no flaky tests detected"

  # Stage 5: Report - Aggregate coverage, quality gates, and publish summary
  report:
    name: Test Report & Quality Gates
    runs-on: ubuntu-latest
    needs: [test, burn-in]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: coverage
        continue-on-error: true

      - name: Merge coverage profiles
        id: coverage
        run: |
          # Ensure coverage dir exists (no artifacts when test failed/skipped)
          mkdir -p coverage
          echo "mode: atomic" > coverage-merged.out
          find coverage -name '*.out' -exec grep -v '^mode:' {} \; >> coverage-merged.out

          # Extract total coverage percentage (0 if no data)
          total_line=$(go tool cover -func=coverage-merged.out 2>/dev/null | tail -1)
          if [ -z "$total_line" ]; then
            echo "No coverage data (tests may have failed or produced no coverage)"
            echo "percentage=0" >> "$GITHUB_OUTPUT"
          else
            echo "$total_line"
            coverage_pct=$(echo "$total_line" | awk '{print $NF}' | tr -d '%')
            echo "percentage=$coverage_pct" >> "$GITHUB_OUTPUT"
          fi

      - name: Quality gate - Coverage threshold
        env:
          COVERAGE_PCT: ${{ steps.coverage.outputs.percentage }}
          THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}
        run: |
          echo "Coverage: ${COVERAGE_PCT}% (threshold: ${THRESHOLD}%)"
          if [ "$(echo "$COVERAGE_PCT < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE_PCT}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage gate passed."

      - name: Quality gate - Test pass rate
        run: |
          # P0 quality gate: all test shards must pass
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Test shards did not all pass (result: ${{ needs.test.result }})"
            exit 1
          fi
          echo "Test pass rate gate passed (P0: 100% required, 100% achieved)."

      - name: Generate summary
        if: always()
        run: |
          coverage_pct="${{ steps.coverage.outputs.percentage }}"
          test_result="${{ needs.test.result }}"
          burnin_result="${{ needs.burn-in.result }}"

          # Determine overall status
          if [ "$test_result" == "success" ]; then
            status_icon="PASS"
          else
            status_icon="FAIL"
          fi

          {
            echo "## Test Pipeline Summary"
            echo ""
            echo "| Metric | Value | Gate |"
            echo "|--------|-------|------|"
            echo "| **Test Result** | ${test_result} | P0: 100% pass required |"
            echo "| **Coverage** | ${coverage_pct}% | >= ${{ env.COVERAGE_THRESHOLD }}% |"
            echo "| **Burn-in** | ${burnin_result} | scheduled/manual only |"
            echo "| **Shards** | 3 | - |"
            echo "| **Overall** | ${status_icon} | - |"
            echo ""

            if [ "$burnin_result" == "failure" ]; then
              echo "> **Warning**: Flaky tests detected during burn-in - Review logs"
              echo ""
            fi

            echo "### Quality Gates"
            echo ""
            echo "| Gate | Criteria | Status |"
            echo "|------|----------|--------|"
            if [ "$test_result" == "success" ]; then
              echo "| P0 Pass Rate | 100% tests pass | PASS |"
            else
              echo "| P0 Pass Rate | 100% tests pass | FAIL |"
            fi
            threshold="${{ env.COVERAGE_THRESHOLD }}"
            if [ "$(echo "$coverage_pct >= $threshold" | bc -l 2>/dev/null || echo 1)" -eq 1 ]; then
              echo "| Coverage | >= ${threshold}% | PASS (${coverage_pct}%) |"
            else
              echo "| Coverage | >= ${threshold}% | FAIL (${coverage_pct}%) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-merged.out
          retention-days: 30

      - name: Annotate PR on failure
        if: failure() && github.event_name == 'pull_request'
        run: |
          echo "::warning::Quality gates failed. Check the Test Report job for details."
