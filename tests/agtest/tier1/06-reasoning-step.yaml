version: "1.0"
name: reasoning-step
intent: "emit a reasoning trace alongside a bare text answer that completes the loop"
agent:
  provider: replay
  model: scripts/06-reasoning-step.responses.yaml
timeout: 30000
assert:
  output:
    contains: ["reasoning-step produced the final answer"]
  syscalls:
    includes: ["ReasonStep"]
    excludes: ["Kill"]
